name: Automatique Bourse

on:
  schedule:
    # S'exécute à 21h30 (heure UTC) du lundi au vendredi
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Permet de lancer le programme à la demande pour tester

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les outils
        run: pip install yfinance requests

      - name: Lancer la recherche
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python tracker.py
