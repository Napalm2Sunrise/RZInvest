name: Hourly Tracker

on:
  schedule:
    # S'exécute à min 05, toutes les heures de 08h05 à 22h05 UTC, du lundi (1) au vendredi (5)
    - cron: '5 6-20 * * 1-5'
  workflow_dispatch: # Conserve la possibilité de lancer manuellement

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le bot à pusher data.json

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter le tracker Python
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python tracker.py

      - name: Commit et Push de data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto-update data.json" || exit 0
          git push
