<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; padding: 16px; padding-bottom: 30px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .title { font-size: 18px; font-weight: 800; color: #38bdf8; }
    .last-update { font-size: 11px; color: #64748b; }

    /* Nav Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; background: #1e293b; color: #94a3b8; border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }

    /* Content Sections */
    .section { display: none; }
    .section.active { display: block; }

    /* Cards */
    .card { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ticker-name { font-weight: 800; font-size: 15px; color: #f8fafc; }
    .price-tag { font-weight: 700; font-size: 14px; }
    .pos { color: #34d399; }
    .neg { color: #f87171; }

    .news-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #f1f5f9; line-height: 1.3; }
    .news-summary { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-bottom: 10px; }
    .news-link { font-size: 12px; color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-block; }

    /* Badges SMA200 / News */
    .badge-sma { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-block; margin-top: 4px; }
    .bg-alert { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .bg-ok { background: rgba(52, 211, 153, 0.2); color: #34d399; }

    /* Badges Ratios Colorés (Vert / Jaune / Rouge) */
    .badge-ratio {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      display: inline-block;
      text-align: center;
    }
    .badge-green { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-yellow { background: rgba(234, 179, 8, 0.18); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-red { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-neutral { background: rgba(255, 255, 255, 0.05); color: #9ca3af; border: 1px solid rgba(255, 255, 255, 0.1); }

    /* Controls & Selects */
    .select-control {
      width: 100%;
      padding: 10px 14px;
      background-color: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Style du Tableau de Ratios */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .ratios-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
      white-space: nowrap;
    }

    .ratios-table th {
      background-color: #0f172a;
      color: #94a3b8;
      padding: 12px 10px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ratios-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-weight: 600;
    }

    .ratios-table tr:last-child td {
      border-bottom: none;
    }

    .ratios-table tr:nth-child(even) {
      background-color: rgba(15, 23, 42, 0.3);
    }

    .ratios-table .ticker-cell {
      font-weight: 800;
      color: #38bdf8;
      position: sticky;
      left: 0;
      background: #1e293b;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">Trading Hub</div>
      <div class="last-update" id="update-time">Chargement...</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('news-sec', this)">📰 News</button>
    <button class="tab-btn" onclick="switchTab('prices-sec', this)">📈 Cours</button>
    <button class="tab-btn" onclick="switchTab('fund-sec', this)">📊 Ratios</button>
  </div>

  <!-- Menu déroulant Tickers -->
  <div style="margin: 15px 0;">
    <label for="ticker-select" style="font-size: 13px; color: #94a3b8; margin-bottom: 5px; display: block;">
      Sélectionner un ticker :
    </label>
    <select id="ticker-select" class="select-control" onchange="filterBySelect(this.value)">
      <option value="ALL">TOUS LES TICKERS</option>
    </select>
  </div>

  <!-- SECTION NEWS -->
  <div id="news-sec" class="section active">
    <div id="news-container"></div>
  </div>

  <!-- SECTION PRICES -->
  <div id="prices-sec" class="section">
    <div id="prices-container"></div>
  </div>

  <!-- SECTION FUNDAMENTALS (TABLEAU) -->
  <div id="fund-sec" class="section">
    <div class="table-container">
      <table class="ratios-table">
        <thead id="ratios-thead">
          <tr>
            <th class="ticker-cell">Tickers</th>
            <th>Croit. CA.</th>
            <th>Fwd P/E</th>
            <th>EV/EBITDA</th>
            <th>ROE</th>
            <th>PEG</th>
            <th>Marge Net %</th>
          </tr>
        </thead>
        <tbody id="ratios-tbody">
          <!-- Injecté dynamiquement -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      try { window.Telegram.WebApp.expand(); } catch (e) {}
    }

    let globalData = null;
    let selectedTicker = 'ALL';

    // Fonction de classification tricolore : Vert / Jaune / Rouge
    function getMetricBadgeClass(metricName, valStr) {
      if (!valStr || valStr === "N/A") return "badge-neutral";
      
      let num = parseFloat(valStr.replace(/[^\d.-]/g, ''));
      if (isNaN(num)) return "badge-neutral";

      switch(metricName) {
        case "Croit. CA.":
        case "rev_growth":
          if (num >= 10) return "badge-green";
          if (num >= 0) return "badge-yellow";
          return "badge-red";

        case "Marge Net %":
        case "net_margin":
          if (num >= 15) return "badge-green";
          if (num >= 5) return "badge-yellow";
          return "badge-red";

        case "ROE":
        case "roe":
          if (num >= 15) return "badge-green";
          if (num >= 8) return "badge-yellow";
          return "badge-red";

        case "Fwd P/E":
        case "pe":
          if (num <= 20) return "badge-green";
          if (num <= 35) return "badge-yellow";
          return "badge-red";

        case "EV/EBITDA":
        case "ev":
          if (num <= 12) return "badge-green";
          if (num <= 22) return "badge-yellow";
          return "badge-red";

        case "PEG":
        case "peg":
          if (num <= 1.0) return "badge-green";
          if (num <= 2.0) return "badge-yellow";
          return "badge-red";

        default:
          return "badge-neutral";
      }
    }

    async function loadData() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        if (!res.ok) throw new Error('Impossible de charger data.json');
        globalData = await res.json();
        document.getElementById('update-time').innerText = "MàJ: " + (globalData.updated_at || "N/A");
        
        buildFilters();
        renderAll();
      } catch (e) {
        console.error(e);
        document.getElementById('update-time').innerText = "Erreur de chargement data.json";
      }
    }

    function buildFilters() {
      const select = document.getElementById('ticker-select');
      if (!select || !globalData || !globalData.prices) return;

      select.innerHTML = '<option value="ALL">TOUS LES TICKERS</option>';

      globalData.prices.forEach(p => {
        const option = document.createElement('option');
        option.value = p.ticker;
        option.textContent = p.ticker;
        select.appendChild(option);
      });
    }

    function filterBySelect(symbol) {
      selectedTicker = symbol;
      renderAll();
    }

    function switchTab(secId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(secId).classList.add('active');
      btn.classList.add('active');
    }

    function renderAll() {
      if(!globalData) return;

      // 1. News
      const newsCont = document.getElementById('news-container');
      newsCont.innerHTML = '';
      const filteredNews = selectedTicker === 'ALL' ? (globalData.news || []) : (globalData.news || []).filter(n => n.ticker === selectedTicker);
      
      if (filteredNews.length === 0) {
        newsCont.innerHTML = '<div style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;">Aucune actualité disponible pour ce ticker.</div>';
      } else {
        filteredNews.forEach(n => {
          newsCont.innerHTML += `
            <div class="card">
              <div class="card-header">
                <span class="ticker-name">${n.ticker}</span>
                <span class="last-update">${n.date}</span>
              </div>
              <div class="news-title">${n.title}</div>
              <div class="news-summary">${n.summary}</div>
              ${n.link ? `<a class="news-link" href="${n.link}" target="_blank">Lire l'article complet →</a>` : ''}
            </div>`;
        });
      }

      // 2. Prices
      const priceCont = document.getElementById('prices-container');
      priceCont.innerHTML = '';
      const filteredPrices = selectedTicker === 'ALL' ? (globalData.prices || []) : (globalData.prices || []).filter(p => p.ticker === selectedTicker);

      filteredPrices.forEach(p => {
        const changeNum = parseFloat(p.change) || 0;
        const isPos = changeNum >= 0;
        priceCont.innerHTML += `
          <div class="card">
            <div class="card-header">
              <div>
                <span class="ticker-name">${p.ticker}</span>
                <span class="badge-sma ${p.sma200 && p.sma200.includes('Under') ? 'bg-alert' : 'bg-ok'}">${p.sma200 || ''}</span>
              </div>
              <div style="text-align:right">
                <div class="price-tag">${p.price} ${p.currency || ''}</div>
                <div class="last-update ${isPos ? 'pos' : 'neg'}">${isPos ? '+' : ''}${changeNum.toFixed(2)}%</div>
              </div>
            </div>
            <div style="font-size:11px; color:#94a3b8; margin-top:6px;">📅 Prochaine pub. : <b>${p.earnings || 'N/A'}</b></div>
          </div>`;
      });

      // 3. Fundamentals
      renderFundamentals();
    }

    function renderFundamentals() {
      const thead = document.getElementById('ratios-thead');
      const tbody = document.getElementById('ratios-tbody');

      tbody.innerHTML = '';
      const filteredFund = selectedTicker === 'ALL' ? (globalData.fundamentals || []) : (globalData.fundamentals || []).filter(f => f.ticker === selectedTicker);

      if (filteredFund.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px; color: #64748b;">Aucune donnée disponible.</td></tr>';
        return;
      }

      if (selectedTicker !== 'ALL' && filteredFund[0].quarters && filteredFund[0].quarters.length > 0) {
        const fund = filteredFund[0];

        let headHtml = `<tr><th class="ticker-cell">Métrique</th>`;
        fund.quarters.forEach(q => { headHtml += `<th>${q}</th>`; });
        headHtml += `</tr>`;
        thead.innerHTML = headHtml;

        const metrics = ["Croit. CA.", "Marge Net %", "Fwd P/E", "EV/EBITDA", "ROE", "PEG"];
        metrics.forEach(m => {
          let rowHtml = `<tr><td class="ticker-cell">${m}</td>`;
          const vals = (fund.history && fund.history[m]) || [];
          fund.quarters.forEach((_, idx) => {
            const val = vals[idx] || 'N/A';
            const badgeClass = getMetricBadgeClass(m, val);
            rowHtml += `<td><span class="badge-ratio ${badgeClass}">${val}</span></td>`;
          });
          rowHtml += `</tr>`;
          tbody.innerHTML += rowHtml;
        });

      } else {
        thead.innerHTML = `
          <tr>
            <th class="ticker-cell">Tickers</th>
            <th>Croit. CA.</th>
            <th>Fwd P/E</th>
            <th>EV/EBITDA</th>
            <th>ROE</th>
            <th>PEG</th>
            <th>Marge Net %</th>
          </tr>`;

        filteredFund.forEach(f => {
          tbody.innerHTML += `
            <tr>
              <td class="ticker-cell">${f.ticker}</td>
              <td><span class="badge-ratio ${getMetricBadgeClass('rev_growth', f.rev_growth)}">${f.rev_growth || 'N/A'}</span></td>
              <td><span class="badge-ratio ${getMetricBadgeClass('pe', f.pe)}">${f.pe || 'N/A'}</span></td>
              <td><span class="badge-ratio ${getMetricBadgeClass('ev', f.ev)}">${f.ev || 'N/A'}</span></td>
              <td><span class="badge-ratio ${getMetricBadgeClass('roe', f.roe)}">${f.roe || 'N/A'}</span></td>
              <td><span class="badge-ratio ${getMetricBadgeClass('peg', f.peg)}">${f.peg || 'N/A'}</span></td>
              <td><span class="badge-ratio ${getMetricBadgeClass('net_margin', f.net_margin)}">${f.net_margin || 'N/A'}</span></td>
            </tr>`;
        });
      }
    }

    loadData();
  </script>
</body>
</html>
