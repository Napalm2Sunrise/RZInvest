<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financier</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --neutral: #6b7280;
        }

        body {
            padding: 10px;
            font-size: 0.9rem;
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: var(--neutral);
        }

        .filter-section {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
            cursor: pointer;
        }

        nav button {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #fff;
        }

        .bg-green { background-color: var(--success); }
        .bg-red { background-color: var(--danger); }
        .bg-neutral { background-color: var(--neutral); }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .table-container {
            overflow-x: auto;
        }

        table th, table td {
            font-size: 0.8rem;
            padding: 8px;
            text-align: center;
        }

        .tooltip {
            position: relative;
            cursor: help;
            border-bottom: 1px dotted var(--neutral);
        }

        .ticker-btn {
            background: none;
            border: none;
            color: #60a5fa;
            text-decoration: underline;
            padding: 0;
            font: inherit;
            cursor: pointer;
            font-weight: bold;
        }

        .ticker-btn:hover {
            color: #93c5fd;
        }

        .news-item {
            border-bottom: 1px solid #334155;
            padding: 8px 0;
        }

        .news-item a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 500;
        }

        .news-item a:hover {
            text-decoration: underline;
        }

        .news-date {
            font-size: 0.75rem;
            color: var(--neutral);
        }
    </style>
</head>
<body>

    <main class="container-fluid">
        <div class="header-status">
            <span><strong>Dashboard Financier</strong></span>
            <span id="lastUpdate">MàJ: --</span>
        </div>

        <!-- Section Filtres -->
        <div class="filter-section">
            <div class="checkbox-group">
                <label><input type="checkbox" class="cat-checkbox" value="stock" checked onchange="applyFilters()"> Stocks</label>
                <label><input type="checkbox" class="cat-checkbox" value="reit" checked onchange="applyFilters()"> REITs</label>
                <label><input type="checkbox" class="cat-checkbox" value="crypto" checked onchange="applyFilters()"> Cryptos</label>
            </div>
            <div>
                <select id="tickerFilter" onchange="applyFilters()">
                    <option value="">Tous les tickers</option>
                </select>
            </div>
        </div>

        <!-- Navigation Onglets -->
        <nav>
            <ul style="width: 100%; display: flex; justify-content: space-around; padding: 0;">
                <li><button class="tab-btn secondary" data-tab="news" onclick="switchTab('news')">News</button></li>
                <li><button class="tab-btn contrast" data-tab="cours" onclick="switchTab('cours')">Cours</button></li>
                <li><button class="tab-btn secondary" data-tab="ratios" onclick="switchTab('ratios')">Ratios</button></li>
                <li><button class="tab-btn secondary" data-tab="pub" onclick="switchTab('pub')">Pub.</button></li>
            </ul>
        </nav>

        <!-- Contenu des Onglets -->
        <div id="tab-news" class="tab-content" style="display:none;">
            <div id="newsContainer">Chargement des actualités...</div>
        </div>

        <div id="tab-cours" class="tab-content">
            <div id="coursGrid" class="card-grid"></div>
        </div>

        <div id="tab-ratios" class="tab-content" style="display:none;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th><span class="tooltip" title="Price to Earnings futur (basé sur les estimations de bénéfices futurs)">Fwd P/E</span></th>
                            <th><span class="tooltip" title="Enterprise Value / EBITDA (Valorisation globale / Cash-flow opérationnel)">EV/EBITDA</span></th>
                            <th><span class="tooltip" title="Price/Earnings to Growth (Ratio P/E divisé par le taux de croissance)">PEG</span></th>
                            <th><span class="tooltip" title="Return On Equity (Rendement des capitaux propres)">ROE (%)</span></th>
                            <th>Marge Nette (Historique)</th>
                        </tr>
                    </thead>
                    <tbody id="ratiosTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-pub" class="tab-content" style="display:none;">
            <div id="pubContainer">
                <h5>Prochaines publications / Résultats récents</h5>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Ticker</th>
                                <th>Catégorie</th>
                                <th>Dates de publication</th>
                                <th>Lien externe</th>
                            </tr>
                        </thead>
                        <tbody id="pubTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        let allData = [];
        let filteredData = [];
        let currentTab = 'cours';

        // Chargement initial
        fetch('data.json')
            .then(res => res.json())
            .then(json => {
                document.getElementById('lastUpdate').innerText = `MàJ: ${json.updated_at}`;
                allData = json.data;
                populateTickerDropdown();
                applyFilters();
            })
            .catch(err => {
                console.error("Erreur de chargement data.json:", err);
                document.getElementById('coursGrid').innerHTML = "<p>Erreur lors du chargement des données.</p>";
            });

        function populateTickerDropdown() {
            const select = document.getElementById('tickerFilter');
            select.innerHTML = '<option value="">Tous les tickers</option>';
            allData.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.ticker;
                opt.innerText = item.ticker;
                select.appendChild(opt);
            });
        }

        function applyFilters() {
            const selectedCats = Array.from(document.querySelectorAll('.cat-checkbox:checked')).map(cb => cb.value);
            const selectedTicker = document.getElementById('tickerFilter').value;

            filteredData = allData.filter(item => {
                const matchesCat = selectedCats.length === 0 || selectedCats.includes(item.category);
                const matchesTicker = !selectedTicker || item.ticker === selectedTicker;
                return matchesCat && matchesTicker;
            });

            renderCurrentTab();
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.classList.remove('secondary');
                    btn.classList.add('contrast');
                } else {
                    btn.classList.remove('contrast');
                    btn.classList.add('secondary');
                }
            });

            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(`tab-${tabName}`).style.display = 'block';

            renderCurrentTab();
        }

        // Clic sur le ticker dans la table des Ratios : Sélectionne l'actif et reste dans l'onglet Ratios
        function selectTickerFromTable(ticker) {
            const tickerSelect = document.getElementById('tickerFilter');
            if (tickerSelect) {
                tickerSelect.value = ticker;
                applyFilters(); // Maintient l'affichage sur 'ratios' mais filtre uniquement cet actif
            }
        }

        function renderCurrentTab() {
            if (currentTab === 'cours') renderCours();
            else if (currentTab === 'ratios') renderRatios();
            else if (currentTab === 'pub') renderPub();
            else if (currentTab === 'news') renderNews();
        }

        function renderCours() {
            const grid = document.getElementById('coursGrid');
            grid.innerHTML = '';

            filteredData.forEach(item => {
                const changeClass = item.day_change_pct >= 0 ? 'bg-green' : 'bg-red';
                const changeSign = item.day_change_pct >= 0 ? '+' : '';

                const sma200Text = item.diff_sma200_pct !== null ? `${item.diff_sma200_pct >= 0 ? '+' : ''}${item.diff_sma200_pct.toFixed(2)}%` : 'N/A';
                const rsiText = item.rsi_w !== null ? item.rsi_w.toFixed(1) : 'N/A';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${item.ticker}</span>
                        <span class="badge ${changeClass}">${changeSign}${item.day_change_pct.toFixed(2)}%</span>
                    </div>
                    <div class="metric-row">
                        <span>Prix:</span>
                        <strong>${item.price.toFixed(2)} ${item.currency}</strong>
                    </div>
                    <div class="metric-row">
                        <span>RSI 14W:</span>
                        <span>${rsiText}</span>
                    </div>
                    <div class="metric-row">
                        <span>SMA 200W:</span>
                        <span>${sma200Text}</span>
                    </div>
                    <div class="metric-row">
                        <span>Écart ATH 52W:</span>
                        <span>${item.diff_ath_pct.toFixed(2)}%</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderRatios() {
            const tbody = document.getElementById('ratiosTableBody');
            tbody.innerHTML = '';

            const ratioData = filteredData.filter(item => item.category !== 'crypto');

            if (ratioData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">Aucune donnée disponible pour cette sélection.</td></tr>';
                return;
            }

            ratioData.forEach(item => {
                const finHistText = item.financials_hist && item.financials_hist.length > 0 
                    ? item.financials_hist.map(f => `${f.year}: ${f.net_margin !== null ? f.net_margin.toFixed(1) + '%' : 'N/A'}`).join(' | ')
                    : 'N/A';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <button class="ticker-btn" onclick="selectTickerFromTable('${item.ticker}')">
                            ${item.ticker}
                        </button>
                    </td>
                    <td>${item.fwd_pe ? item.fwd_pe.toFixed(2) : 'N/A'}</td>
                    <td>${item.ev_ebitda ? item.ev_ebitda.toFixed(2) : 'N/A'}</td>
                    <td>${item.peg_ratio ? item.peg_ratio.toFixed(2) : 'N/A'}</td>
                    <td>${item.roe ? item.roe.toFixed(2) + '%' : 'N/A'}</td>
                    <td style="font-size: 0.75rem;">${finHistText}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderPub() {
            const tbody = document.getElementById('pubTableBody');
            tbody.innerHTML = '';

            const pubData = filteredData.filter(item => item.category !== 'crypto');

            if (pubData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Aucune donnée de publication pour cette sélection.</td></tr>';
                return;
            }

            pubData.forEach(item => {
                const datesText = item.earnings_dates && item.earnings_dates.length > 0 ? item.earnings_dates.join(', ') : 'Non communiquée';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.ticker}</strong></td>
                    <td>${item.category.toUpperCase()}</td>
                    <td>${datesText}</td>
                    <td><a href="https://stockanalysis.com/stocks/${item.ticker.toLowerCase()}/financials/" target="_blank">Stock Analysis ↗</a></td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderNews() {
            const container = document.getElementById('newsContainer');
            const selectedTicker = document.getElementById('tickerFilter').value;

            let query = " Bourse marché financier";
            if (selectedTicker) {
                query = ` ${selectedTicker} stock crypto market`;
            }

            const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=fr&gl=FR&ceid=FR:fr`;
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

            container.innerHTML = "Chargement des actualités...";

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'ok' && data.items.length > 0) {
                        container.innerHTML = '';
                        data.items.slice(0, 10).forEach(item => {
                            const newsDiv = document.createElement('div');
                            newsDiv.className = 'news-item';
                            newsDiv.innerHTML = `
                                <div><a href="${item.link}" target="_blank">${item.title}</a></div>
                                <div class="news-date">${new Date(item.pubDate).toLocaleString('fr-FR')}</div>
                            `;
                            container.appendChild(newsDiv);
                        });
                    } else {
                        container.innerHTML = "<p>Aucune actualité trouvée.</p>";
                    }
                })
                .catch(() => {
                    container.innerHTML = "<p>Impossible de charger le flux d'actualités.</p>";
                });
        }
    </script>
</body>
</html>
